spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/ticketdb
    username: ticket
    password: ticket
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 8081
springdoc:
  swagger-ui:
    path: /swagger-ui.html
